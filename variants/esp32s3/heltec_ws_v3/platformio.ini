; Heltec Wireless Stick V3 (HTIT-WS_V3): ESP32-S3 + SX1262 with a 0.49" 64x32 OLED.
; Electrically the same as the WiFi LoRa 32 V3 apart from the display, so it reuses that
; PlatformIO board definition and the HELTEC_V3 hardware model (no upstream model exists).
; Ported from the local 2.2.23 variant (meshtastic/legacy-2.2.23/heltec_ws_v3).
[env:heltec-ws-v3]
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = extra
board_check = true
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -I variants/esp32s3/heltec_ws_v3
