; Custom build for the vehicle node: Heltec WiFi LoRa 32 V3 + MicoAir MG-902 GPS
; (u-blox M9 + QMC5883L compass). Same as heltec-v3 except for the pin map in variant.h.
[env:heltec-v3-vehicle]
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = extra
board_check = true
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -I variants/esp32s3/heltec_v3_vehicle
  -I variants/esp32s3/heltec_v3_fishy_common
build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/heltec_v3_vehicle>
  +<../variants/esp32s3/heltec_v3_fishy_common>
